[package]
name = "docmap-desktop"
version = "0.6.0"
edition = "2021"
description = "Desktop workspace for docmap.nvim's module maps"
authors = ["Stefan Bartl"]
license = "MIT"
# The binary is named after the product rather than the crate default so the
# installed executable reads `docmap-desktop.exe`, not `app.exe`.
default-run = "docmap-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the webview load a file off disk. The map is
# an ordinary `index.html` in the scanned repository, and a webview refuses
# `file://` inside an iframe on an app-protocol page; the asset protocol is
# the sanctioned way through, paired with `assetProtocol.scope` in
# tauri.conf.json. Without the feature the build fails outright rather than
# silently producing a window that cannot show anything, which is the right
# way round.
tauri = { version = "2", features = ["protocol-asset"] }
# The folder picker for "Add project". A native dialog rather than a text
# field: the thing being named is a directory that must exist, and letting the
# OS answer that is both less code and less wrong.
tauri-plugin-dialog = "2"
# The engine as a bundled sidecar (see #7 in HANDOVER.md): a fallback
# for when nothing is configured and nothing is on PATH, so the app works
# out of the box instead of sending a first-run user to build
# docmap.nvim's standalone binary themselves before anything works.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The blocking HTTP client for ai-desktop's `/ask` and `/health` (agent.rs). The
# webview cannot make that call (ai-desktop refuses any request that carries a
# foreign `Origin`, which a browser always sends), and spawning `curl` would
# depend on a binary a Windows user may not have on `PATH` (decision 3 of
# 2026-09-21, RULES_AGENT_CONCEPT.md). Every default feature is off: ai-desktop
# listens on loopback, so there is no TLS, no gzip, no proxy and no cookies to
# pay for; what is left is `ureq-proto`, `base64`, `log` and `utf8-zero`.
# Measured 2026-11-06, release build with LTO: 10 478 592 bytes with it, 10 174 464 without it and the
# client code that uses it, so 304 kB or 2.9 % of the program at most.
ureq = { version = "3", default-features = false }
# The key under which a model's answer is kept (agent.rs): the same SHA-256 the
# Neovim side uses for its answer cache. Already in the tree through Tauri, so
# naming it adds no crate.
sha2 = "0.10"

[dev-dependencies]
# `tauri::test::mock_app()` — a real AppHandle without a real window, so
# the sidecar/resource resolution in engine_info() can be exercised by
# `cargo test` instead of only by eye through a GUI this environment
# cannot see.
tauri = { version = "2", features = ["test"] }

[profile.release]
# A viewer that ships as a download: size is worth more here than the last
# few percent of speed, and the expensive work happens in a separate process
# anyway (see ROADMAP.md — the analysis is docmap.nvim's binary).
opt-level = "s"
lto = true
codegen-units = 1
strip = true
